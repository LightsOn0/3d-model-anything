name: Build iOS capture app

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Unique application bundle identifier
        required: true
        default: com.lightson0.housecapture
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/house-capture
        run: xcodegen generate

      - name: Build unsigned Release app
        working-directory: apps/house-capture
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          xcodebuild \
            -project HouseCapture.xcodeproj \
            -scheme HouseCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            build

      - name: Package sideloadable IPA
        working-directory: apps/house-capture
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/HouseCapture.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -x "$APP/HouseCapture"
          rm -rf Payload output
          mkdir -p Payload output
          cp -R "$APP" Payload/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/HouseCapture.app/Info.plist
          zip -qry output/HouseCapture-unsigned.ipa Payload
          ls -lh output/HouseCapture-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-iOS
          path: apps/house-capture/output/HouseCapture-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
