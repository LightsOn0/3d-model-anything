name: Build unsigned iOS IPA (shared)

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: Directory containing the Xcode project
        required: true
        default: apps/house-capture
        type: string
      xcode_project:
        description: Xcode project filename
        required: true
        default: HouseCapture.xcodeproj
        type: string
      scheme:
        description: Shared Xcode scheme to build
        required: true
        default: HouseCapture
        type: string
      app_name:
        description: Built .app and IPA basename
        required: true
        default: HouseCapture
        type: string
      bundle_id:
        description: Unique application bundle identifier
        required: true
        default: com.lightson0.housecapture
        type: string
      artifact_name:
        description: GitHub Actions artifact name
        required: true
        default: HouseCapture-iOS
        type: string
      generate_project:
        description: Run XcodeGen before building
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        if: inputs.generate_project
        run: brew install xcodegen

      - name: Generate Xcode project
        if: inputs.generate_project
        working-directory: ${{ inputs.project_dir }}
        run: xcodegen generate

      - name: Build unsigned Release app
        working-directory: ${{ inputs.project_dir }}
        env:
          XCODE_PROJECT: ${{ inputs.xcode_project }}
          SCHEME: ${{ inputs.scheme }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            build

      - name: Package and verify sideloadable IPA
        working-directory: ${{ inputs.project_dir }}
        env:
          APP_NAME: ${{ inputs.app_name }}
          EXPECTED_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test -x "$APP/$EXECUTABLE"
          test "$ACTUAL_BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"
          test ! -d "$APP/_CodeSignature"
          rm -rf Payload output
          mkdir -p Payload output
          cp -R "$APP" Payload/
          zip -qry "output/$APP_NAME-unsigned.ipa" Payload
          ls -lh "output/$APP_NAME-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.project_dir }}/output/${{ inputs.app_name }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
